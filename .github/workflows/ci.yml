name: CI

on:
  # Push to main verifies the merged state. Feature-branch pushes are covered
  # by pull_request runs — triggering on both push and pull_request for the
  # same commit doubled minute consumption for every PR iteration.
  push:
    branches: [main]
  pull_request:
    branches: [main, 'v3.0-*']

# Cancel in-flight runs for the same ref when a new push lands — no point
# burning Actions minutes verifying a commit that's already been superseded
# by a follow-up push. `github.ref` is a built-in non-user-controlled context
# (e.g. 'refs/heads/main', 'refs/pull/26/merge'), safe to interpolate here.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

  e2e:
    name: Playwright E2E tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        # --project=desktop-chrome on PRs (fast, ~45 min less runtime than all
        # 3 viewports), full 3-viewport sweep only when pushing to main.
        run: npx playwright test ${{ github.event_name == 'pull_request' && '--project=desktop-chrome' || '' }}

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ruff
        run: pip install ruff==0.15.7

      - name: Lint
        run: ruff check

      - name: Run tests
        run: python -m pytest tests/ -v
