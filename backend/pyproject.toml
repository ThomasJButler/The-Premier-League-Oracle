[tool.ruff]
target-version = "py311"
line-length = 120

# Lint the active codebase — exclude dead/deferred modules
src = ["app", "tests"]
exclude = [
    "app/models/lstm_predictor.py",      # Pro-tier, deferred (P3c)
    "app/models/transformer_model.py",   # Pro-tier, deferred (P3c)
    "app/models/modern_oracle.py",       # Pro-tier, deferred (P3c)
    "app/models/xgboost_model.py",       # Pro-tier, deferred (P3c)
    "app/security/auth.py",              # Dead code — not imported by main.py (P3d)
    "app/security/secrets.py",           # Dead code — not imported by main.py (P3d)
    "app/security/validators.py",        # Dead code — not imported by main.py (P3d)
    "app/features/advanced_engineering.py",  # Pro-tier, 63 stub methods (P3a)
    "app/notebooks/",                    # Jupyter notebooks
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (Python 3.11+ syntax)
    "B",    # flake8-bugbear (common bug patterns)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # Line too long — handled by formatter, not linter
    "B008",   # Function call in default argument — FastAPI Depends() pattern
    "B904",   # Within except, raise from — too noisy for existing code
    "B905",   # zip() without strict= — adding strict breaks backward compat
    "SIM108", # Ternary instead of if-else — readability preference
    "SIM113", # Use enumerate — too minor to enforce
    "RUF001", # Ambiguous unicode in strings — intentional (en dash, multiplication sign)
    "RUF002", # Ambiguous unicode in docstrings — intentional
    "RUF003", # Ambiguous unicode in comments — intentional
    "RUF012", # Mutable class variable without ClassVar — too strict for dataclasses
    "W293",   # Blank line with whitespace in docstrings — cosmetic only
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
# Format settings — not enforced in CI yet, available for local use
quote-style = "double"
indent-style = "space"
