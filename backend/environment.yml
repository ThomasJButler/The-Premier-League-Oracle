# Premier League Oracle - Anaconda Environment
name: premier-league-oracle

channels:
  - conda-forge
  - pytorch
  - defaults

dependencies:
  # Python version
  - python=3.11

  # Core ML Libraries
  - scikit-learn=1.6.1
  - xgboost=2.1.3

  # Deep Learning
  - pytorch=2.6.0
  - pytorch-cuda=12.1  # Remove if no GPU
  - torchvision
  - torchaudio

  # Data Processing
  - pandas=2.2.3
  - numpy=2.1.3
  - scipy=1.14.1

  # Visualisation
  - matplotlib=3.9.2
  - seaborn=0.13.2

  # Jupyter
  - jupyter=1.1.1
  - notebook=7.2.2
  - ipywidgets=8.1.5
  - jupyterlab=4.2.5

  # Web Framework
  - fastapi=0.115.5
  - uvicorn=0.32.1
  - redis-py=5.2.0

  # Development Tools
  - ipython=8.27.0
  - pytest=8.3.3
  - black=24.8.0

  # Utilities
  - requests=2.32.3
  - pyyaml=6.0.2
  - click=8.1.7

  # Pip dependencies
  - pip
  - pip:
    # ML specific
    - joblib==1.4.2

    # API related
    - pydantic==2.9.2
    - httpx==0.27.2
    - websockets==13.1

    # Utilities
    - tqdm==4.66.5

    # ---------------------------------------------------------------------------
    # Pro-tier / optional — not required for free-tier runtime.
    # Install separately when needed.
    # ---------------------------------------------------------------------------
    # - shap==0.46.0           # SHAP explanations (XGBoost model)
    # - optuna==4.0.0          # Hyperparameter tuning
    # - mlflow==2.17.2         # Experiment tracking
    # - langchain==0.3.7       # AI agent (modern_oracle.py)
    # - langchain-openai==0.2.9
    # - langchain-community    # LangChain tools
    # - chromadb==0.5.20       # Vector store
    # - openai
