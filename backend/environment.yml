# 🔮 God Mode Premier League Oracle - Anaconda Environment
name: premier-league-oracle

channels:
  - conda-forge
  - pytorch
  - defaults

dependencies:
  # Python version
  - python=3.11

  # Core ML Libraries
  - scikit-learn=1.3.2
  - xgboost=2.0.3
  - lightgbm=4.1.0
  
  # Deep Learning
  - pytorch=2.1.2
  - pytorch-cuda=12.1  # Remove if no GPU
  - torchvision
  - torchaudio
  
  # Data Processing
  - pandas=2.1.4
  - numpy=1.26.2
  - scipy=1.11.4
  
  # Visualization
  - matplotlib=3.8.2
  - seaborn=0.13.0
  - plotly=5.18.0
  
  # Jupyter
  - jupyter=1.0.0
  - notebook=7.0.6
  - ipywidgets=8.1.1
  - jupyterlab=4.0.9
  
  # Web Framework
  - fastapi=0.108.0
  - uvicorn=0.25.0
  - redis-py=5.0.1
  
  # Database
  - sqlalchemy=2.0.25
  - psycopg2=2.9.9
  
  # Development Tools
  - ipython=8.19.0
  - pytest=7.4.3
  - black=23.12.1
  
  # Additional conda packages
  - requests=2.31.0
  - pyyaml=6.0.1
  - click=8.1.7
  
  # Pip dependencies (not available in conda)
  - pip
  - pip:
    # ML specific
    - catboost==1.2.2
    - shap==0.44.0
    - optuna==3.5.0
    - mlflow==2.9.2
    
    # LangChain and AI
    - langchain==0.1.0
    - langchain-openai==0.0.2
    - chromadb==0.4.22
    - openai==1.6.1
    
    # Feature engineering
    - feature-engine==1.6.2
    - featuretools==1.28.0
    
    # API related
    - pydantic==2.5.3
    - httpx==0.26.0
    - websockets==12.0
    
    # Additional tools
    - python-dotenv==1.0.0
    - loguru==0.7.2
    - tqdm==4.66.1
    - joblib==1.3.2
    
    # Betting/probability
    - pymc==5.10.3
    - arviz==0.17.0