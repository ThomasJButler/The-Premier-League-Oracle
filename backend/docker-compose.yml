version: '3.8'

services:
  # Main application — free-tier backend API
  oracle-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - FOOTBALL_DATA_API_KEY=${FOOTBALL_DATA_API_KEY:-}
    volumes:
      - ./app:/app/app
      - ./models:/app/models
    restart: unless-stopped

